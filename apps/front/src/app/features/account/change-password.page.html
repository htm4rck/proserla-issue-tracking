<section class="card">
  <div class="head">
    <div>
      <h3>Cambiar contrasena</h3>
      @if (user) {
        <p>{{ user.fullName }} · {{ user.email }}</p>
      }
    </div>
    <a routerLink="/dashboard">Volver al tablero</a>
  </div>

  <form [formGroup]="form" class="password-form" (ngSubmit)="submit()">
    <label>Contrasena actual
      <input type="password" formControlName="currentPassword" autocomplete="current-password" />
    </label>
    <label>Nueva contrasena
      <input type="password" formControlName="newPassword" autocomplete="new-password" />
    </label>
    <label>Confirmar nueva contrasena
      <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
    </label>
    <button type="submit" [disabled]="saving">{{ saving ? 'Guardando...' : 'Actualizar contrasena' }}</button>
  </form>

  @if (message) { <p class="ok">{{ message }}</p> }
  @if (error) { <p class="err">{{ error }}</p> }
</section>
