<div class="login-shell">
  <aside class="brand-panel">
    <div class="brand-header">
      <div class="brand-badge">RACI</div>
      <h1>Registro de actos y condiciones inseguras</h1>
    </div>
  </aside>

  <section class="login-panel">
    <div class="card">
      <h2>Iniciar sesion</h2>
      <p class="subtitle">Ingresa tus credenciales para acceder al panel.</p>
      <form [formGroup]="form" class="grid" (ngSubmit)="submit()">
        <label>
          Correo
          <input formControlName="email" type="email" autocomplete="email" placeholder="admin@demo.local" />
        </label>
        <label>
          Contraseña
          <input formControlName="password" type="password" autocomplete="current-password" placeholder="********" />
        </label>
        <button type="submit" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Ingresando...' : 'Ingresar' }}
        </button>
      </form>
      @if (message) { <p class="error">{{ message }}</p> }
    </div>
    <footer class="login-footer">
      <tordo-branding />
      <button type="button" class="login-about-btn" (click)="showAbout = true">Acerca de</button>
    </footer>
  </section>
</div>

<tordo-about
  [visible]="showAbout"
  appName="RACI"
  appVersion="1.0"
  appDescription="REGISTROS DE ACTOS Y CONDICIONES INSEGURAS"
  (close)="showAbout = false"
/>
