<div class="login-shell">
  <aside class="brand-panel">
    <div class="brand-header">
      <div class="brand-badge">RACI</div>
      <h1>Registro de actos y condiciones inseguras</h1>
    </div>
  </aside>

  <section class="login-panel">
    <div class="card">
      <h2>Iniciar sesion</h2>
      <p class="subtitle">Ingresa tus credenciales para acceder al panel.</p>
      <form [formGroup]="form" class="grid" (ngSubmit)="submit()">
        <label>
          Correo
          <input formControlName="email" type="email" autocomplete="email" placeholder="admin@demo.local" />
        </label>
        <label>
          Contraseña
          <input formControlName="password" type="password" autocomplete="current-password" placeholder="********" />
        </label>
        <button type="submit" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Ingresando...' : 'Ingresar' }}
        </button>
      </form>
      @if (message) { <p class="error">{{ message }}</p> }
    </div>
    <footer class="login-footer">
      © 2026 <a href="https://tordo.io" target="_blank" rel="noopener">Tordo</a> — Soluciones de integración empresarial
    </footer>
  </section>
</div>
