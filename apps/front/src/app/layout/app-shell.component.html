<div class="layout" [class.nav-open]="navOpen">

  <!-- Overlay para cerrar nav en mobile -->
  <div class="nav-overlay" (click)="navOpen = false"></div>

  <aside class="sidebar panel">
    <div class="brand">
      <div class="logo">SST</div>
      <div>
        <h1>RACI</h1>
        <p>REGISTROS DE ACTOS Y CONDICIONES INSEGURAS</p>
      </div>
      <button type="button" class="nav-close" (click)="navOpen = false" aria-label="Cerrar menú">✕</button>
    </div>

    <nav>
      @for (item of menu; track item.route) {
        <a [routerLink]="item.route" routerLinkActive="active" class="nav-item" (click)="navOpen = false">
          <span class="icon">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </aside>

  <div class="content-wrap">
    <header class="topbar panel">
      <div class="topbar-left">
        <button type="button" class="hamburger" (click)="navOpen = !navOpen" aria-label="Abrir menú">☰</button>
        <div>
          <h2>Consola operativa</h2>
          <p class="topbar-sub">Seguimiento de inspecciones, evidencias y cumplimiento</p>
        </div>
      </div>
      @if (session.user; as user) {
        <div class="session-box">
          <strong class="session-name">{{ user.fullName }}</strong>
          <a class="login-link" routerLink="/account/password">Clave</a>
          <button type="button" class="login-link" (click)="logout()">Salir</button>
          <button type="button" class="about-btn" (click)="tordoShell.showAbout()" title="Acerca de">!</button>
        </div>
      } @else {
        <a class="login-link" routerLink="/login">Iniciar sesión</a>
      }
    </header>

    <main class="content">
      <router-outlet />
    </main>

    <tordo-shell
      appName="RACI"
      appVersion="1.0"
      appDescription="Registros de actos y condiciones inseguras"
      #tordoShell
    />
  </div>
</div>
