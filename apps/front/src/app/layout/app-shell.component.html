<div class="layout">
  <aside class="sidebar panel">
    <div class="brand">
      <div class="logo">ITP</div>
      <div>
        <h1>RACI</h1>
        <p>Condiciones o actos inseguros/p>
      </div>
    </div>

    <nav>
      @for (item of menu; track item.route) {
        <a [routerLink]="item.route" routerLinkActive="active" class="nav-item">
          <span class="icon">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </aside>

  <div class="content-wrap">
    <header class="topbar panel">
      <div>
        <h2>Consola operativa</h2>
        <p>Seguimiento de incidencias, evidencias y cumplimiento</p>
      </div>
      @if (session.user; as user) {
        <div class="session-box">
          <strong>{{ user.fullName }}</strong>
          <a class="login-link" routerLink="/account/password">Clave</a>
          <button type="button" class="login-link" (click)="logout()">Salir</button>
        </div>
      } @else {
        <a class="login-link" routerLink="/login">Iniciar sesión</a>
      }
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
